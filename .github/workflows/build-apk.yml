name: Build HALDER Android APK & Release AAB

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK and Release AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (node:sqlite compatible)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK Tools
        run: |
          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/tools/bin:${ANDROID_HOME}/platform-tools:${PATH}"
          if command -v sdkmanager &> /dev/null; then
            echo "sdkmanager located at: $(which sdkmanager)"
          else
            echo "Searching for sdkmanager in ${ANDROID_HOME}..."
            SDKM_PATH=$(find ${ANDROID_HOME} -name sdkmanager -type f | head -n 1)
            if [ -n "$SDKM_PATH" ]; then
              export PATH="$(dirname $SDKM_PATH):${PATH}"
            fi
          fi
          yes | sdkmanager --licenses || true
          sdkmanager "cmdline-tools;latest" "platform-tools" "platforms;android-34" "platforms;android-36" "build-tools;34.0.0" "build-tools;36.0.0"

      - name: Install Dependencies
        run: npm ci

      - name: Run Backend Security & Integrity Tests
        run: npm run server:test
        env:
          NODE_ENV: test
          JWT_SECRET: halder_super_secure_ci_jwt_secret_test_2026_mandi

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK & Release AAB
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: HALDER-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Release AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: HALDER-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
