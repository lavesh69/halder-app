name: HALDER SaaS CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Build, Lint and Full Automated Test Suite
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Static Analysis & Linter
        run: npm run lint

      - name: Type Check & Production Frontend Build
        run: npm run build

      - name: Run Core Backend Test Suite
        run: npm run server:test
        env:
          NODE_ENV: test
          JWT_SECRET: halder_super_secure_ci_jwt_secret_test_2026_mandi

      - name: Run Zero-Trust Security Matrix & RBAC Tests
        run: npm run server:security
        env:
          NODE_ENV: test
          JWT_SECRET: halder_super_secure_ci_jwt_secret_test_2026_mandi

      - name: Run Profile, Address & Concurrency Suite
        run: npm run server:profile
        env:
          NODE_ENV: test
          JWT_SECRET: halder_super_secure_ci_jwt_secret_test_2026_mandi

      - name: Run KYC Review & Real Push Notification Tests
        run: npm run server:kyc-push
        env:
          NODE_ENV: test
          JWT_SECRET: halder_super_secure_ci_jwt_secret_test_2026_mandi

      - name: Run Farmer Real Earnings & Payout Tests
        run: npm run server:earnings
        env:
          NODE_ENV: test
          JWT_SECRET: halder_super_secure_ci_jwt_secret_test_2026_mandi

      - name: Run 300 km Geo-Logistics & Kisan Delivery Tests
        run: npm run server:geo
        env:
          NODE_ENV: test
          JWT_SECRET: halder_super_secure_ci_jwt_secret_test_2026_mandi

      - name: Run Real-Time WebSocket Chat & 5-Language i18n Tests
        run: npm run server:chat-i18n
        env:
          NODE_ENV: test
          JWT_SECRET: halder_super_secure_ci_jwt_secret_test_2026_mandi

      - name: Run Adversarial Chat Injection & Stress Tests
        run: npm run server:chat-adversarial
        env:
          NODE_ENV: test
          JWT_SECRET: halder_super_secure_ci_jwt_secret_test_2026_mandi

      - name: Run Multi-Gateway and Payment Gateway Tests
        run: |
          npm run server:phonepe
          npm run server:multi-gateway
        env:
          NODE_ENV: test
          JWT_SECRET: halder_super_secure_ci_jwt_secret_test_2026_mandi

      - name: Run Ecosystem Modules (2, 4, 5, 6, 8) Tests
        run: npx tsx server/tests/ecosystem.test.ts
        env:
          NODE_ENV: test
          JWT_SECRET: halder_super_secure_ci_jwt_secret_test_2026_mandi

      - name: Run Standalone End-to-End Consumer Lifecycle Journey
        run: npm run server:e2e
        env:
          NODE_ENV: test
          JWT_SECRET: halder_super_secure_ci_jwt_secret_test_2026_mandi

      - name: Run Production Readiness & Keystore Verification Suite
        run: npm run server:production
        env:
          NODE_ENV: test
          JWT_SECRET: halder_super_secure_ci_jwt_secret_test_2026_mandi
