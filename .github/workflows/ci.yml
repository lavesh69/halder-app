name: HALDER SaaS CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Build, Lint and Automated Test Suite
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check and Frontend Build
        run: npm run build

      - name: Run Core Backend Test Suite
        run: npm run server:test
        env:
          NODE_ENV: test
          JWT_SECRET: halder_super_secure_ci_jwt_secret_test_2026_mandi

      - name: Run Security Matrix and RBAC Tests
        run: npm run server:security
        env:
          NODE_ENV: test
          JWT_SECRET: halder_super_secure_ci_jwt_secret_test_2026_mandi

      - name: Run Profile and KYC/Push Tests
        run: |
          npm run server:profile
          npm run server:kyc-push
        env:
          NODE_ENV: test
          JWT_SECRET: halder_super_secure_ci_jwt_secret_test_2026_mandi

      - name: Run Multi-Gateway and Payment Tests
        run: |
          npm run server:phonepe
          npm run server:multi-gateway
        env:
          NODE_ENV: test
          JWT_SECRET: halder_super_secure_ci_jwt_secret_test_2026_mandi

      - name: Run Production Phases Suite
        run: npm run server:production
        env:
          NODE_ENV: test
          JWT_SECRET: halder_super_secure_ci_jwt_secret_test_2026_mandi
