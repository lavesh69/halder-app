# SPDX-License-Identifier: Apache-2.0
# HALDER Staging Docker Compose Stack
# Architecture: Caddy (TLS + Static Frontend) + Node.js 22 Express (API + WebSockets + SQLite WAL)

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - web_dist:/srv/dist:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      halder-api:
        condition: service_healthy

  halder-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=staging
      - PORT=5000
      - DB_PATH=/app/data/halder_staging.db
      - UPLOAD_DIR=/app/uploads
      - CORS_ORIGIN=${CORS_ORIGIN:-https://staging.halder.example.com}
      - JWT_SECRET=${JWT_SECRET:-halder_staging_jwt_secret_change_in_production_2026}
      - JWT_EXPIRES_IN=7d
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=1000
    volumes:
      - staging_db_data:/app/data
      - staging_uploads:/app/uploads
      - staging_backups:/app/server/backups
      - web_dist:/app/dist
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  staging_db_data:
    driver: local
  staging_uploads:
    driver: local
  staging_backups:
    driver: local
  caddy_data:
  caddy_config:
  web_dist:
