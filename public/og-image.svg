<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.04)" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)" />

  <!-- Background Decorative Rings -->
  <circle cx="1050" cy="150" r="320" stroke="rgba(255,255,255,0.06)" stroke-width="2" />
  <circle cx="1050" cy="150" r="220" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  <circle cx="150" cy="520" r="280" stroke="rgba(255,255,255,0.05)" stroke-width="2" />

  <!-- Brand Emblem (Large) -->
  <g transform="translate(100, 100)">
    <rect width="100" height="100" rx="28" fill="#10b981" />
    <path d="M50 72V34" stroke="#a7f3d0" stroke-width="5" stroke-linecap="round" />
    <path d="M50 54C37 54 28 42 28 30C41 30 50 40 50 54Z" fill="#34d399" />
    <path d="M50 44C63 44 72 32 72 20C59 20 50 30 50 44Z" fill="url(#gold)" />
    <circle cx="50" cy="24" r="6" fill="#fef3c7" />
  </g>

  <!-- Brand Title -->
  <text x="230" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="8" fill="#ffffff">HALDER</text>
  <text x="235" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#a7f3d0">DIRECT MANDI &amp; KISAN</text>

  <!-- Main Headline -->
  <text x="100" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff">Farm-Fresh Produce Directly From Indian Farmers</text>
  <text x="100" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="500" fill="#d1fae5">खेत से सीधे आपके घर • Zero Middlemen • 100% Fair Pricing</text>

  <!-- Feature Cards Grid -->
  <g transform="translate(100, 410)">
    <!-- Card 1: Mandi Rates -->
    <rect x="0" y="0" width="225" height="120" rx="16" fill="url(#cardBg)" stroke="rgba(255,255,255,0.15)" />
    <text x="24" y="44" font-size="26">🌾</text>
    <text x="24" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Live Mandi Rates</text>
    <text x="24" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" fill="#a7f3d0">Daily APMC modal prices</text>

    <!-- Card 2: AI Disease Scanner -->
    <rect x="250" y="0" width="225" height="120" rx="16" fill="url(#cardBg)" stroke="rgba(255,255,255,0.15)" />
    <text x="274" y="44" font-size="26">📸</text>
    <text x="274" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff">AI Crop Scanner</text>
    <text x="274" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" fill="#a7f3d0">Instant disease remedies</text>

    <!-- Card 3: B2B Wholesale -->
    <rect x="500" y="0" width="225" height="120" rx="16" fill="url(#cardBg)" stroke="rgba(255,255,255,0.15)" />
    <text x="524" y="44" font-size="26">🤝</text>
    <text x="524" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff">B2B Wholesale</text>
    <text x="524" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" fill="#a7f3d0">Bulk RFQ quotes &amp; deals</text>

    <!-- Card 4: Verified Logistics -->
    <rect x="750" y="0" width="245" height="120" rx="16" fill="url(#cardBg)" stroke="rgba(255,255,255,0.15)" />
    <text x="774" y="44" font-size="26">🚚</text>
    <text x="774" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Direct Logistics</text>
    <text x="774" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" fill="#a7f3d0">Doorstep delivery with OTP</text>
  </g>

  <!-- URL Badge Bottom Right -->
  <rect x="860" y="220" width="240" height="48" rx="24" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.2)" />
  <text x="980" y="250" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15" font-weight="700" fill="#6ee7b7">halder-app.vercel.app</text>
</svg>
