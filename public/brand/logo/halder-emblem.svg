<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" width="100%" height="100%">
  <defs>
    <!-- Sky Sunrise Gradient -->
    <linearGradient id="halderSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7" />
      <stop offset="60%" stop-color="#FEE7B8" />
      <stop offset="100%" stop-color="#F9D48C" />
    </linearGradient>

    <!-- Sun Radial Glow -->
    <radialGradient id="halderSun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFC107" />
      <stop offset="70%" stop-color="#F4A017" />
      <stop offset="100%" stop-color="#E28905" />
    </radialGradient>

    <!-- Mountain Gradient -->
    <linearGradient id="halderMount" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D6A4F" />
      <stop offset="100%" stop-color="#1B4332" />
    </linearGradient>

    <!-- Fields Gradient (Back) -->
    <linearGradient id="halderFieldBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#388E3C" />
      <stop offset="100%" stop-color="#1B5E20" />
    </linearGradient>

    <!-- Fields Gradient (Front) -->
    <linearGradient id="halderFieldFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50" />
      <stop offset="100%" stop-color="#2E7D32" />
    </linearGradient>

    <!-- Master Leaf Gradient -->
    <linearGradient id="halderLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A8E063" />
      <stop offset="50%" stop-color="#56AB2F" />
      <stop offset="100%" stop-color="#0B3D2E" />
    </linearGradient>

    <!-- Bag Frame Clip -->
    <clipPath id="bagInnerClip">
      <path d="M 28 36 C 28 33, 30 31, 33 31 L 87 31 C 90 31, 92 33, 92 36 L 96 92 C 96 99, 91 104, 84 104 L 36 104 C 29 104, 24 99, 24 92 Z" />
    </clipPath>
  </defs>

  <!-- SHOPPING BAG HANDLE -->
  <path d="M 44 32 C 44 16, 76 16, 76 32" stroke="#0B3D2E" stroke-width="6" stroke-linecap="round" fill="none" />
  <path d="M 45 32 C 45 18, 75 18, 75 32" stroke="#2E7D32" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- SHOPPING BAG CONTAINER (Background / Border) -->
  <path d="M 28 36 C 28 33, 30 31, 33 31 L 87 31 C 90 31, 92 33, 92 36 L 96 92 C 96 99, 91 104, 84 104 L 36 104 C 29 104, 24 99, 24 92 Z" fill="#F6F4E8" stroke="#0B3D2E" stroke-width="4.5" stroke-linejoin="round" />

  <!-- INNER ARTWORK (CLIPPED TO BAG SILHOUETTE) -->
  <g clip-path="url(#bagInnerClip)">
    <!-- Sky -->
    <rect x="20" y="25" width="80" height="85" fill="url(#halderSky)" />

    <!-- Sunrise Rays -->
    <g opacity="0.35" stroke="#F4A017" stroke-width="1.5">
      <line x1="60" y1="56" x2="30" y2="35" />
      <line x1="60" y1="56" x2="42" y2="30" />
      <line x1="60" y1="56" x2="60" y2="28" />
      <line x1="60" y1="56" x2="78" y2="30" />
      <line x1="60" y1="56" x2="90" y2="35" />
    </g>

    <!-- Rising Sun -->
    <circle cx="60" cy="56" r="13" fill="url(#halderSun)" />

    <!-- Mountains in Distance -->
    <polygon points="22,74 38,52 54,74" fill="url(#halderMount)" opacity="0.85" />
    <polygon points="46,74 66,48 86,74" fill="url(#halderMount)" opacity="0.95" />
    <polygon points="72,74 88,56 98,74" fill="url(#halderMount)" opacity="0.8" />

    <!-- Distant Fields (Rolling Contours) -->
    <path d="M 22 72 Q 46 62 98 70 L 98 106 L 22 106 Z" fill="url(#halderFieldBack)" />
    <!-- Furrow Line -->
    <path d="M 22 76 Q 50 68 98 75" stroke="#A8E063" stroke-width="1" opacity="0.5" fill="none" />

    <!-- Farmhouse & Trees -->
    <g transform="translate(36, 63)">
      <!-- Tree Left -->
      <circle cx="2" cy="7" r="4.5" fill="#1B4332" />
      <circle cx="1" cy="6" r="3.5" fill="#2D6A4F" />
      <!-- House -->
      <rect x="7" y="5" width="11" height="8" fill="#FFFFFF" stroke="#0B3D2E" stroke-width="0.8" />
      <polygon points="5.5,5 12.5,0 19.5,5" fill="#D9534F" stroke="#0B3D2E" stroke-width="0.8" />
      <rect x="11" y="8" width="3" height="5" fill="#0B3D2E" />
      <rect x="8" y="7" width="2" height="2" fill="#F4A017" />
      <!-- Tree Right -->
      <circle cx="23" cy="7" r="4" fill="#2E7D32" />
      <circle cx="22" cy="6.5" r="3" fill="#52B788" />
    </g>

    <!-- Foreground Curved Agricultural Terraces -->
    <path d="M 22 83 Q 54 73 98 84 L 98 106 L 22 106 Z" fill="url(#halderFieldFront)" />
    <path d="M 22 88 Q 58 79 98 90" stroke="#A8E063" stroke-width="1.2" opacity="0.6" fill="none" />
    <path d="M 22 94 Q 62 86 98 96" stroke="#A8E063" stroke-width="1" opacity="0.5" fill="none" />

    <!-- Large Prominent Leaf Silhouette (Brand Signature) -->
    <path d="M 46 104 C 54 94, 72 82, 92 68 C 91 82, 82 98, 62 104 Z" fill="url(#halderLeaf)" stroke="#0B3D2E" stroke-width="1.2" />
    <!-- Leaf Vein -->
    <path d="M 54 102 Q 72 86 86 74" stroke="#A8E063" stroke-width="1.2" stroke-linecap="round" fill="none" />
    <path d="M 64 94 Q 72 90 77 88" stroke="#A8E063" stroke-width="0.8" stroke-linecap="round" fill="none" />
    <path d="M 72 88 Q 78 84 81 81" stroke="#A8E063" stroke-width="0.8" stroke-linecap="round" fill="none" />
  </g>

  <!-- Bag Outer Stroke Accent & Base Shadow -->
  <path d="M 28 36 C 28 33, 30 31, 33 31 L 87 31 C 90 31, 92 33, 92 36 L 96 92 C 96 99, 91 104, 84 104 L 36 104 C 29 104, 24 99, 24 92 Z" stroke="#0B3D2E" stroke-width="4.5" fill="none" />
  
  <!-- Subtle Handle Rivets -->
  <circle cx="44" cy="33" r="2.2" fill="#F4A017" stroke="#0B3D2E" stroke-width="1" />
  <circle cx="76" cy="33" r="2.2" fill="#F4A017" stroke="#0B3D2E" stroke-width="1" />
</svg>