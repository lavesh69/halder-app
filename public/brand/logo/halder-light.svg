<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 84" fill="none" width="100%" height="100%">
  <!-- Light Cream Surface Plate -->
  <rect width="100%" height="100%" rx="16" fill="#F6F4E8" stroke="#D8DFD5" stroke-width="1.5" />

  <!-- EMBLEM SCALED -->
  <g transform="translate(10, -4) scale(0.76)">
    <path d="M 44 32 C 44 16, 76 16, 76 32" stroke="#0B3D2E" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M 45 32 C 45 18, 75 18, 75 32" stroke="#2E7D32" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 28 36 C 28 33, 30 31, 33 31 L 87 31 C 90 31, 92 33, 92 36 L 96 92 C 96 99, 91 104, 84 104 L 36 104 C 29 104, 24 99, 24 92 Z" fill="#FFFFFF" stroke="#0B3D2E" stroke-width="4.5" stroke-linejoin="round" />
    
    <g clip-path="url(#hlBagInnerClip)">
      <rect x="20" y="25" width="80" height="85" fill="#FFF4D9" />
      <circle cx="60" cy="56" r="13" fill="#F4A017" />
      <polygon points="22,74 38,52 54,74" fill="#2D6A4F" opacity="0.85" />
      <polygon points="46,74 66,48 86,74" fill="#1B4332" opacity="0.95" />
      <path d="M 22 72 Q 46 62 98 70 L 98 106 L 22 106 Z" fill="#2E7D32" />
      
      <!-- Farmhouse -->
      <g transform="translate(36, 63)">
        <circle cx="2" cy="7" r="4.5" fill="#1B4332" />
        <rect x="7" y="5" width="11" height="8" fill="#FFFFFF" stroke="#0B3D2E" stroke-width="0.8" />
        <polygon points="5.5,5 12.5,0 19.5,5" fill="#D9534F" stroke="#0B3D2E" stroke-width="0.8" />
        <rect x="11" y="8" width="3" height="5" fill="#0B3D2E" />
        <circle cx="23" cy="7" r="4" fill="#2E7D32" />
      </g>

      <path d="M 22 83 Q 54 73 98 84 L 98 106 L 22 106 Z" fill="#4CAF50" />
      <path d="M 46 104 C 54 94, 72 82, 92 68 C 91 82, 82 98, 62 104 Z" fill="#2E7D32" stroke="#0B3D2E" stroke-width="1.2" />
      <path d="M 54 102 Q 72 86 86 74" stroke="#A8E063" stroke-width="1.2" stroke-linecap="round" fill="none" />
    </g>
    <path d="M 28 36 C 28 33, 30 31, 33 31 L 87 31 C 90 31, 92 33, 92 36 L 96 92 C 96 99, 91 104, 84 104 L 36 104 C 29 104, 24 99, 24 92 Z" stroke="#0B3D2E" stroke-width="4.5" fill="none" />
  </g>

  <!-- CHARCOAL & FOREST GREEN TYPOGRAPHY -->
  <g transform="translate(98, 16)">
    <text x="0" y="36" font-family="'Montserrat', 'Inter', system-ui, sans-serif" font-weight="900" font-size="34" letter-spacing="3" fill="#0B3D2E">
      HALDER
    </text>
    <circle cx="166" cy="18" r="4.5" fill="#F4A017" />
    <text x="2" y="54" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="10.5" letter-spacing="3.5" fill="#2E7D32">
      FARM TO MARKET
    </text>
  </g>

  <defs>
    <clipPath id="hlBagInnerClip">
      <path d="M 28 36 C 28 33, 30 31, 33 31 L 87 31 C 90 31, 92 33, 92 36 L 96 92 C 96 99, 91 104, 84 104 L 36 104 C 29 104, 24 99, 24 92 Z" />
    </clipPath>
  </defs>
</svg>