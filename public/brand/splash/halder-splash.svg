<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" fill="none" width="100%" height="100%">
  <defs>
    <radialGradient id="splashBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#124C36" />
      <stop offset="50%" stop-color="#0B3D2E" />
      <stop offset="100%" stop-color="#061B14" />
    </radialGradient>
    <clipPath id="splashClip">
      <path d="M 28 36 C 28 33, 30 31, 33 31 L 87 31 C 90 31, 92 33, 92 36 L 96 92 C 96 99, 91 104, 84 104 L 36 104 C 29 104, 24 99, 24 92 Z" />
    </clipPath>
  </defs>

  <!-- Deep Forest Background -->
  <rect width="400" height="640" fill="url(#splashBg)" />

  <!-- Agricultural field contour waves in background -->
  <path d="M -20 180 Q 200 120 420 190" stroke="#134D3A" stroke-width="2" opacity="0.4" fill="none" />
  <path d="M -20 230 Q 200 170 420 240" stroke="#134D3A" stroke-width="2" opacity="0.4" fill="none" />
  <path d="M -20 480 Q 200 420 420 490" stroke="#134D3A" stroke-width="2" opacity="0.3" fill="none" />

  <!-- Centered Master Emblem (translate 140, 160) scale(1) -->
  <g transform="translate(140, 160)">
    <path d="M 44 32 C 44 16, 76 16, 76 32" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M 45 32 C 45 18, 75 18, 75 32" stroke="#A8E063" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 28 36 C 28 33, 30 31, 33 31 L 87 31 C 90 31, 92 33, 92 36 L 96 92 C 96 99, 91 104, 84 104 L 36 104 C 29 104, 24 99, 24 92 Z" fill="#F6F4E8" stroke="#FFFFFF" stroke-width="4.5" stroke-linejoin="round" />
    
    <g clip-path="url(#splashClip)">
      <rect x="20" y="25" width="80" height="85" fill="#FFF4D9" />
      <circle cx="60" cy="56" r="13" fill="#F4A017" />
      <polygon points="22,74 38,52 54,74" fill="#2D6A4F" />
      <polygon points="46,74 66,48 86,74" fill="#1B4332" />
      <path d="M 22 72 Q 46 62 98 70 L 98 106 L 22 106 Z" fill="#2E7D32" />
      
      <!-- Farmhouse -->
      <g transform="translate(36, 63)">
        <circle cx="2" cy="7" r="4.5" fill="#1B4332" />
        <rect x="7" y="5" width="11" height="8" fill="#FFFFFF" stroke="#0B3D2E" stroke-width="0.8" />
        <polygon points="5.5,5 12.5,0 19.5,5" fill="#D9534F" stroke="#0B3D2E" stroke-width="0.8" />
        <rect x="11" y="8" width="3" height="5" fill="#0B3D2E" />
        <circle cx="23" cy="7" r="4" fill="#2E7D32" />
      </g>

      <path d="M 22 83 Q 54 73 98 84 L 98 106 L 22 106 Z" fill="#388E3C" />
      <path d="M 46 104 C 54 94, 72 82, 92 68 C 91 82, 82 98, 62 104 Z" fill="#A8E063" stroke="#0B3D2E" stroke-width="1.2" />
      <path d="M 54 102 Q 72 86 86 74" stroke="#0B3D2E" stroke-width="1.2" stroke-linecap="round" fill="none" />
    </g>
    <path d="M 28 36 C 28 33, 30 31, 33 31 L 87 31 C 90 31, 92 33, 92 36 L 96 92 C 96 99, 91 104, 84 104 L 36 104 C 29 104, 24 99, 24 92 Z" stroke="#FFFFFF" stroke-width="4.5" fill="none" />
    <circle cx="44" cy="33" r="2.2" fill="#F4A017" />
    <circle cx="76" cy="33" r="2.2" fill="#F4A017" />
  </g>

  <!-- Typography -->
  <text x="200" y="324" font-family="'Montserrat', system-ui, sans-serif" font-weight="900" font-size="44" letter-spacing="6" fill="#F6F4E8" text-anchor="middle">
    HALDER
  </text>
  <text x="200" y="356" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="14" letter-spacing="5" fill="#A8E063" text-anchor="middle">
    FARM TO MARKET
  </text>
  <text x="200" y="378" font-family="'Inter', system-ui, sans-serif" font-weight="500" font-size="12" letter-spacing="1" fill="#F6F4E8" opacity="0.7" text-anchor="middle">
    Connecting Indian Farmers Directly to Consumers
  </text>

  <!-- 4 Pillars Badge -->
  <g transform="translate(45, 410)">
    <rect x="0" y="0" width="310" height="28" rx="14" fill="#061B14" stroke="#155D44" stroke-width="1" />
    <text x="155" y="18" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="10.5" fill="#F6F4E8" text-anchor="middle">
      1. Farmers • 2. Fresh Produce • 3. Direct • 4. You
    </text>
  </g>

  <!-- Bottom Tag -->
  <text x="200" y="580" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="11" letter-spacing="1" fill="#A8E063" opacity="0.8" text-anchor="middle">
    100% PROVENANCE • 0% MIDDLEMEN CUT
  </text>
</svg>